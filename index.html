      // ---------------------------------------------------------------------------
      const DIR = ['-', '\\', '|', '/'];
      function dirChar(dx, dy) {

      function css(r, g, b) {

      // ---------------------------------------------------------------------------

        sorted = []; dyn = [];
        for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {
          const i = r * cols + c, L = Lm[i];
          if (L < 0.05) continue;
          const ppx = (c + 0.5) / cols * PW, ppy = (r + 0.5) / rows * PH;
          const rr = rnd(i, 3);

          // which part of the picture is this letter, and when does it appear?
          const dx = ppx - EC.x, dy = ppy - EC.y, d = Math.hypot(dx, dy), adx = Math.abs(ppx - BEAM_X);
          let grp, rev, ang = 0;
          const beamCore = adx < 9 && ppy >= BEAM_TOP && ppy <= BEAM_END;
          if (beamCore) {
            grp = GRP_B;
            rev = beamTime(ppy);
          } else if (d < R_CORONA) {
            grp = GRP_A;
            ang = Math.atan2(dx, -dy); if (ang < 0) ang += TAU;
            // distance along the ring from the top, measured down either side (0 = top, 1 = bottom)
            const f = Math.pow(Math.min(ang, TAU - ang) / Math.PI, 1.2);   // runs a little faster as it falls
            rev = d <= R_RING ? T_RING0 + (T_RING1 - T_RING0) * f
              : T_RING1 + 0.15 + 0.9 * (d - R_RING) / (R_CORONA - R_RING) + 0.3 * rr;
          } else {
            // everything else is reached by light spreading out of the falling line
            grp = GRP_C; rev = spreadTime(ppx, ppy) + 0.2 * rr;
            if (((ppx - FIRE.x) / 72) ** 2 + ((ppy - FIRE.y) / 58) ** 2 < 1 || (Math.abs(ppx - 340) < 22 && ppy > 980 && ppy < 1092)) grp = GRP_F;
            else if (ppy > 730 && ppy < 845 && L > 0.3) grp = GRP_H;      // the bright horizon band shimmers
          }

          // character: density follows brightness, strong edges follow their direction
          const gx = Lat(c + 1, r - 1) + 2 * Lat(c + 1, r) + Lat(c + 1, r + 1) - Lat(c - 1, r - 1) - 2 * Lat(c - 1, r) - Lat(c - 1, r + 1);
          const gy = Lat(c - 1, r + 1) + 2 * Lat(c, r + 1) + Lat(c + 1, r + 1) - Lat(c - 1, r - 1) - 2 * Lat(c, r - 1) - Lat(c + 1, r - 1);
          const G = Math.hypot(gx, gy) / 4;
          const lv = clamp(Math.floor(Math.pow(L, 0.75) * 1.25 * 6), 0, 5);
          const set = RAMP[lv];
          let ch = set[hash(i, 5) % set.length];
          if (beamCore && adx < 6 && L > 0.3) ch = hash(i, 9) % 6 ? '|' : '!';
          else if (G > 0.13 && L > 0.22) ch = DIR[dirChar(-gy, gx)];

          // colour: the painting's own, lifted so thin letters still glow
          let gain = (1.12 + 0.9 * (1 - smooth((L - 0.12) / 0.6))) * (grp === GRP_F ? 1.25 : 1);
          // the ring and the thread are the brightest things in the picture: keep them fully lit
          if ((grp === GRP_A || grp === GRP_B) && L > 0.3) gain = 255 / Math.max(px[i * 4], px[i * 4 + 1], px[i * 4 + 2], 1);
          const cell = {
            x: ix + c * cellW, y: iy + r * cellH, px: ppx, py: ppy, ch, lv, edge: ch !== set[hash(i, 5) % set.length] && G > 0.13,
            L, col: css(px[i * 4] * gain, px[i * 4 + 1] * gain, px[i * 4 + 2] * gain), rev, grp, ang, ph: rr * TAU, i,
          };
          if (grp === GRP_C) sorted.push(cell); else dyn.push(cell);
        }
        sorted.sort((a, b) => a.rev - b.rev);
      }

      function setFont(g) {g.font = `${cellH < 9 ? 'bold ' : ''}${cellH}px ${FONT}`; g.textBaseline = 'top';}

      // paint every static letter that is already due (used after a resize or replay)
      function replay() {
        sctx.clearRect(0, 0, W, H); setFont(sctx);
        ptr = 0;
        while (ptr < sorted.length && sorted[ptr].rev <= tl) {const q = sorted[ptr++]; sctx.fillStyle = q.col; sctx.fillText(q.ch, q.x, q.y);}
        gs = ptr;
      }

      // ---------------------------------------------------------------------------
      // frame
      // ---------------------------------------------------------------------------
      function frame(now) {
        const dt = Math.min(0.1, (now - lastNow) / 1000); lastNow = now;
        requestAnimationFrame(frame);
        ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;
        ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
        if (!ready) return;
        tl += dt;
        const t = tl, rt = realT(), fstep = Math.floor(rt * 9);

        // static letters: paint newly due ones into the permanent layer
        setFont(sctx);
        while (ptr < sorted.length && sorted[ptr].rev <= t) {const q = sorted[ptr++]; sctx.fillStyle = q.col; sctx.fillText(q.ch, q.x, q.y);}
        ctx.drawImage(stat, 0, 0, W, H);

        setFont(ctx);
        // freshly drawn static letters flash white
        while (gs < ptr && sorted[gs].rev < t - 0.5) gs++;
        ctx.fillStyle = '#fff';
        for (let k = gs; k < ptr; k++) {const q = sorted[k]; ctx.globalAlpha = (1 - (t - q.rev) / 0.5) * 0.85 * clamp((q.L - 0.1) * 3, 0, 1); ctx.fillText(q.ch, q.x, q.y);}

        // living parts: ring, corona, beam, horizon, fire
        const LT = [[0, 0, 0], [0, 0, 0], [0, 0, 0]];   // pens of light: left stream, right stream, line
        for (const q of dyn) {
          if (t < q.rev) continue;
          const age = t - q.rev;
          let a = 1, ch = q.ch;
          if (q.grp === GRP_A) a = Math.hypot(q.px - EC.x, q.py - EC.y) > R_RING ? 0.8 + 0.2 * Math.sin(rt * 1.7 + q.ang * 3 + q.ph) : 0.92 + 0.08 * Math.sin(rt * 2 + q.ang * 2);
          else if (q.grp === GRP_B) a = 0.86 + 0.14 * Math.sin(q.py * 0.05 - rt * 5 + q.ph * 0.2);
          else if (q.grp === GRP_H) a = 0.84 + 0.16 * Math.sin(q.px * 0.05 + rt * 1.3 + q.ph);
          else if (q.grp === GRP_F) {
            a = clamp(0.62 + 0.5 * rnd(q.i, fstep) + 0.15 * Math.sin(rt * 9 + q.ph), 0.3, 1);
            if (!q.edge && rnd(q.i, fstep + 77) < 0.35) {const set = RAMP[clamp(q.lv + (rnd(q.i, fstep) < 0.5 ? -1 : 1), 0, 5)]; ch = set[hash(q.i, fstep) % set.length];}
          }
          ctx.globalAlpha = a; ctx.fillStyle = q.col; ctx.fillText(ch, q.x, q.y);
          if (age < 0.5) {ctx.globalAlpha = (1 - age / 0.5) * 0.9 * clamp((q.L - 0.1) * 3, 0, 1); ctx.fillStyle = '#fff'; ctx.fillText(ch, q.x, q.y);}
          if (age < 0.06 && (q.grp === GRP_A || q.grp === GRP_B) && (q.grp === GRP_B || Math.hypot(q.px - EC.x, q.py - EC.y) <= R_RING)) {
            const s = q.grp === GRP_B ? LT[2] : q.px < EC.x ? LT[0] : LT[1]; s[0] += q.x; s[1] += q.y; s[2]++;
          }
        }
        ctx.globalAlpha = 1;

        // soft bloom
        gctx.clearRect(0, 0, glowCv.width, glowCv.height);
        gctx.filter = 'blur(2px)'; gctx.drawImage(cv, 0, 0, glowCv.width, glowCv.height); gctx.filter = 'none';
        ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = 0.75;
        ctx.drawImage(glowCv, 0, 0, W, H);
        ctx.globalAlpha = 1;

        // the pen of light that draws the ring and the line
        for (const [sx, sy, n] of LT) {
          if (!n) continue;
          const lx = sx / n, ly = sy / n;
          const rg = ctx.createRadialGradient(lx, ly, 0, lx, ly, cellH * 7);
          rg.addColorStop(0, 'rgba(255,255,255,0.9)'); rg.addColorStop(0.25, 'rgba(255,200,140,0.3)'); rg.addColorStop(1, 'rgba(255,140,60,0)');
          ctx.fillStyle = rg; ctx.beginPath(); ctx.arc(lx, ly, cellH * 7, 0, TAU); ctx.fill();
        }
        ctx.globalCompositeOperation = 'source-over';

        if (MESSAGE && t > MSG_T) {
          const n = Math.min(MESSAGE.length, Math.floor((t - MSG_T) * 9));
          const txt = MESSAGE.slice(0, n) + ((Math.floor(t * 2.5) % 2 && n < MESSAGE.length + 6) ? '_' : ' ');
          const fs = Math.max(11, Math.min(iw / (MESSAGE.length + 4) / 0.6, cellH * 3.4));
          ctx.font = `${fs}px ${FONT}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
          ctx.shadowColor = 'rgba(255,110,50,0.9)'; ctx.shadowBlur = fs * 0.6; ctx.fillStyle = '#ffb590';
          ctx.fillText(txt, W / 2, iy + ih * 0.972);
          ctx.shadowBlur = 0; ctx.textAlign = 'left';
        }
      }

      function restart() {tl = 0; if (ready) replay();}
      addEventListener('resize', resize);
      cv.addEventListener('click', restart);
      addEventListener('keydown', e => {if (e.key === 'r' || e.key === 'R' || e.key === ' ') restart();});

      resize();
      requestAnimationFrame(frame);
    })();
  </script>
</body>
